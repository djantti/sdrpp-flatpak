name: libairspyhf
buildsystem: cmake
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
sources:
  - type: git
    url: https://github.com/airspy/airspyhf.git
    commit: 24fe8ffcb00b14f827268bbad89ae1392de055e5
cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/libairspyhf LICENSE.BSD
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/libairspyhf LICENSE.GPL-2.0
