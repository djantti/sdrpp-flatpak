name: libaio
buildsystem: simple
build-commands:
  - make -C src install prefix=/app includedir=/app/include libdir=/app/lib
sources:
  - type: archive
    url: https://codeberg.org/jmoyer/libaio/releases/download/libaio-0.3.113/libaio-0.3.113.tar.gz
    sha256: 2c44d1c5fd0d43752287c9ae1eb9c023f04ef848ea8d4aafa46e9aedb678200b
cleanup:
  - /include
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/libaio COPYING
