name: librtlsdr
buildsystem: cmake
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
sources:
  - type: git
    url: https://github.com/steve-m/librtlsdr.git
    commit: 797f8143266d983c56d8f35d2d442527529dd8a5
cleanup:
  - /bin
  - /include
  - /lib/cmake
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/librtlsdr COPYING
